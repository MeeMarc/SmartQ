<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Queue | SmartQ</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='Admin2/CreateQ.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body>

  <header>
    <nav class="HomeNavbar">
      <a href="{{ url_for('homepage') }}" class="HomeLogo"><strong>SmartQ</strong></a>
      <ul class="HomeNavMenu">
        <li><a href="{{ url_for('homepage') }}">Home</a></li>
        <li><a href="{{ url_for('createq') }}" class="active">Create Queue</a></li>
        <li><a href="{{ url_for('scantracking') }}">Scan Tracking</a></li>
        <li><a href="{{ url_for('admin_settings') }}">Profile</a></li>
        <li><a href="{{ url_for('logout') }}" id="logout">Logout</a></li>
      </ul>
    </nav>
  </header>

<!-- ================= MAIN CONTENT ================= -->
<main class="HomeMainContent">
  <h2>Create Queue and Generate QR Codes</h2>

  <div class="HomeTwoContainer">
    <!-- LEFT: Form -->
    <div class="HomeRightContainer">
      <form id="qrForm">
        <label for="queueType">Queue Type:</label>
        <input type="text" id="queueType" placeholder="e.g. Requirements Submission" required>

        <label for="queuePurpose">Queue Purpose / Description:</label>
        <input type="text" id="queuePurpose" placeholder="e.g. Submit documents or claim ID" required>

        <!-- URL will be auto-generated based on Queue Type -->
        <p style="color: #666; font-size: 0.9rem; margin-top: -10px; margin-bottom: 15px;">
          <em>✓ URL will be automatically generated based on Queue Type</em>
        </p>

        <!-- 🆕 NEW CAPACITY FEATURE -->
        <label for="dailyCapacity">Total Users Per Day:</label>
        <input type="number" id="dailyCapacity" min="1" placeholder="e.g. 20" required>

        <label>Split Between:</label>
        <div class="split-container">
          <input type="number" id="morningCount" min="0" placeholder="Morning (e.g. 10)" required>
          <input type="number" id="afternoonCount" min="0" placeholder="Afternoon (e.g. 10)" required>
        </div>

        <div class="button-container">
          <button type="submit">Generate QR</button>
          <button type="button" id="viewHistoryBtn">View QR History</button>
        </div>
      </form>
    </div>

    <!-- RIGHT: Generated QRs -->
    <div class="HomeLeftContainer">
      <h3>Generated Queues</h3>
      <div class="qr-container" id="qrContainer"></div>
    </div>
  </div>
</main>

<!-- ================= JAVASCRIPT ================= -->
<script>
  const form = document.getElementById("qrForm");
  const container = document.getElementById("qrContainer");

  let qrList = JSON.parse(localStorage.getItem("queues")) || [];

  // Render saved QR codes
  function renderQRs() {
    container.innerHTML = "";
    qrList.forEach((item, index) => {
      const box = document.createElement("div");
      box.className = "qr-box";
      box.innerHTML = `
        <h4>${item.type}</h4>
        <p>${item.purpose}</p>
        ${item.queueNumber ? `<p><strong>Queue #${item.queueNumber}</strong></p>` : ''}
        <p><strong>Capacity:</strong> ${item.dailyCapacity} total  
        (Morning: ${item.morningCount}, Afternoon: ${item.afternoonCount})</p>
        <div id="qr${index}"></div>
        <p><small><strong>URL:</strong> ${item.link}</small></p>
        <div class="qr-actions">
          <button onclick="downloadQR(${index})">Download QR</button>
          <button onclick="deleteQR(${index})">Delete</button>
        </div>
      `;
      container.appendChild(box);

      new QRCode(document.getElementById(`qr${index}`), {
        text: item.link,
        width: 128,
        height: 128
      });
    });
  }

  renderQRs();

  // Handle QR creation
  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const type = document.getElementById("queueType").value.trim();
    const purpose = document.getElementById("queuePurpose").value.trim();
    const dailyCapacity = parseInt(document.getElementById("dailyCapacity").value);
    const morningCount = parseInt(document.getElementById("morningCount").value);
    const afternoonCount = parseInt(document.getElementById("afternoonCount").value);

    if (morningCount + afternoonCount !== dailyCapacity) {
      alert("⚠️ Morning + Afternoon counts must equal Total Users Per Day!");
      return;
    }

    // Save QR to backend - URL will be auto-generated
    fetch("/generate_qr_db", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `type=${encodeURIComponent(type)}&purpose=${encodeURIComponent(purpose)}&dailyCapacity=${dailyCapacity}&morningCount=${morningCount}&afternoonCount=${afternoonCount}`
    })
    .then(res => {
      if (!res.ok) {
        return res.json().then(data => {
          throw new Error(data.error || `Server error: ${res.status}`);
        });
      }
      return res.json();
    })
    .then(data => {
      if (data.error) {
        throw new Error(data.error);
      }
      
      console.log("✅ QR saved with auto-generated URL:", data);
      
      // Add to local list with auto-generated link
      const newQR = { 
        type, 
        purpose, 
        link: data.queue_link || "#", 
        dailyCapacity, 
        morningCount, 
        afternoonCount,
        queueNumber: data.queue_number || 1,
        qrId: data.qr_id
      };
      qrList.push(newQR);
      localStorage.setItem("queues", JSON.stringify(qrList));
      renderQRs();
      form.reset();
    })
    .catch(err => {
      console.error("Error generating QR:", err);
      const errorMsg = err.message || 'Please try again.';
      alert(`❌ Error generating QR: ${errorMsg}\n\nCheck browser console (F12) for details.`);
      
      // Log full error details
      console.error("Full error details:", {
        message: err.message,
        stack: err.stack,
        error: err
      });
    });
  });

  // Resolve QR id either from the saved reference or by looking up the link
  async function resolveQrId(qrItem) {
    if (qrItem.qrId) {
      return qrItem.qrId;
    }

    const link = (qrItem.link || '').trim();
    if (!link) {
      return null;
    }

    const tryLookup = async (endpoint) => {
      const response = await fetch(endpoint);
      if (!response.ok) {
        return null;
      }
      const rows = await response.json();
      const match = rows.find(row => (row.queue_link || '').trim() === link);
      return match ? match.id : null;
    };

    try {
      // Prefer active temp_qr table first
      let foundId = await tryLookup("/temp_qr_data");
      if (!foundId) {
        // Fall back to permanent history
        foundId = await tryLookup("/qr_history_data");
      }

      if (foundId) {
        qrItem.qrId = foundId;
        localStorage.setItem("queues", JSON.stringify(qrList));
      }

      return foundId;
    } catch (error) {
      console.error("Error resolving QR id:", error);
      return null;
    }
  }

  // Delete QR
  async function deleteQR(index) {
    const qrToDelete = qrList[index];
    const userConfirmed = confirm(`Please press OK to delete "${qrToDelete.type}" from the generated queues.`);
    if (!userConfirmed) {
      return;
    }

    let qrId = await resolveQrId(qrToDelete);

    if (!qrId) {
      const forceRemove = confirm(
        "⚠️ QR record was not found on the server.\n\n" +
        "Choose OK to remove it locally from this list, or Cancel to keep it."
      );
      if (forceRemove) {
        qrList.splice(index, 1);
        localStorage.setItem("queues", JSON.stringify(qrList));
        renderQRs();
        alert("✅ QR entry removed locally.");
      }
      return;
    }

    try {
      const response = await fetch("/delete_qr", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: qrId, force: true })
      });

      const data = await response.json();
      if (data.status === "success") {
        qrList.splice(index, 1);
        localStorage.setItem("queues", JSON.stringify(qrList));
        renderQRs();
        console.log("✅ QR deleted successfully");
        alert("✅ QR deleted successfully!");
      } else {
        throw new Error(data.message || "Failed to delete QR");
      }
    } catch (err) {
      console.error("Error deleting QR:", err);
      alert(`❌ Error deleting QR: ${err.message}`);
    }
  }

  // Download QR as image
  function downloadQR(index) {
    const qrCanvas = document.querySelector(`#qr${index} canvas`);
    if (!qrCanvas) return;
    const link = document.createElement('a');
    link.href = qrCanvas.toDataURL("image/png");
    link.download = `QR_${qrList[index].type}.png`;
    link.click();
  }

  // View QR History
  const viewHistoryBtn = document.getElementById("viewHistoryBtn");
  viewHistoryBtn.addEventListener("click", () => {
    fetch("/qr_history_data")
      .then(response => response.json())
      .then(data => {
        container.innerHTML = "";
        data.forEach(item => {
          const box = document.createElement("div");
          box.className = "qr-box";
          box.innerHTML = `
            <h4>${item.queue_type}</h4>
            <p>${item.queue_purpose}</p>
            <p><strong>Capacity:</strong> ${item.daily_capacity} total  
            (Morning: ${item.morning_count}, Afternoon: ${item.afternoon_count})</p>
            <div id="historyQR${item.id}"></div>
            <p><small>${item.queue_link}</small></p>
            <p><small>Created by: ${item.created_by} | ${item.created_at}</small></p>
          `;
          container.appendChild(box);

          new QRCode(document.getElementById(`historyQR${item.id}`), {
            text: item.queue_link,
            width: 128,
            height: 128
          });
        });
      })
      .catch(err => console.error(err));
  });
</script>
</body>
</html>
