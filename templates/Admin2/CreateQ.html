<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Queue | SmartQ</title>
  <!-- Updated 2025-01-10: Service time, schedule, staff management, and auto-calculated queue limit -->
  <link rel="stylesheet" href="{{ url_for('static', filename='Admin2/CreateQ.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body>

  <header>
    <nav class="HomeNavbar">
      <a href="{{ url_for('homepage') }}" class="HomeLogo"><strong>SmartQ</strong></a>
      <ul class="HomeNavMenu">
        <li><a href="{{ url_for('homepage') }}">Home</a></li>
        <li><a href="{{ url_for('createq') }}" class="active">Create Queue</a></li>
        <li><a href="{{ url_for('scantracking') }}">Scan Tracking</a></li>
        <li><a href="{{ url_for('admin_settings') }}">Profile</a></li>
        <li><a href="{{ url_for('logout') }}" id="logout">Logout</a></li>
      </ul>
    </nav>
  </header>

<!-- ================= MAIN CONTENT ================= -->
<main class="HomeMainContent">
  <h2>Create Queue and Generate QR Codes</h2>

  <div class="HomeTwoContainer">
    <!-- LEFT: Form -->
    <div class="HomeRightContainer">
      <form id="qrForm">
        <!-- ========== SECTION 1: Basic Information ========== -->
        <div class="form-section" style="background: #f8f9fa; border: 2px solid #007bff;">
          <h3 style="border-bottom-color: #007bff;">📋 Basic Information</h3>
          
          <label for="queueType">Queue Type:</label>
          <input type="text" id="queueType" placeholder="e.g. Requirements Submission" required>

          <label for="queuePurpose">Queue Purpose / Description:</label>
          <input type="text" id="queuePurpose" placeholder="e.g. Submit documents or claim ID" required>

          <!-- URL will be auto-generated based on Queue Type -->
          <p style="color: #666; font-style: italic;">
            ✓ URL will be automatically generated based on Queue Type
          </p>
        </div>



        <div class="button-container">
          <button type="submit">Generate QR</button>
          <button type="button" id="viewHistoryBtn">View QR History</button>
          <button type="button" id="loadPreviousBtn" style="background: #6c757d; display: none;">📋 Load Queue</button>
        </div>
      </form>
    </div>

    <!-- RIGHT: Generated QRs -->
    <div class="HomeLeftContainer">
      <h3 id="qrContainerTitle">Generated Queues</h3>
      <div class="qr-container" id="qrContainer"></div>
    </div>
  </div>
</main>

<!-- Confirmation Modal -->
<div class="confirmation-overlay" id="confirmationModal" style="display: none;">
  <div class="confirmation-modal">
    <div class="confirmation-icon">⚠️</div>
    <h3 id="confirmationTitle">Confirm Action</h3>
    <p id="confirmationMessage">Are you sure you want to proceed?</p>
    <div class="confirmation-buttons">
      <button class="confirm-btn-yes" id="confirmYes">Yes, Proceed</button>
      <button class="confirm-btn-no" id="confirmNo">Cancel</button>
    </div>
  </div>
</div>

<!-- Success/Error Modal -->
<div class="alert-overlay" id="alertModal" style="display: none;">
  <div class="alert-modal">
    <div class="alert-icon" id="alertIcon">✓</div>
    <p id="alertMessage">Success!</p>
    <button class="alert-btn" id="alertOk">OK</button>
  </div>
</div>

<!-- ================= JAVASCRIPT ================= -->
<script>
  const form = document.getElementById("qrForm");
  const container = document.getElementById("qrContainer");

  let qrList = JSON.parse(localStorage.getItem("queues")) || [];

  // Custom Confirmation Dialog
  function showConfirmation(title, message, onConfirm) {
    const modal = document.getElementById('confirmationModal');
    const titleEl = document.getElementById('confirmationTitle');
    const messageEl = document.getElementById('confirmationMessage');
    const yesBtn = document.getElementById('confirmYes');
    const noBtn = document.getElementById('confirmNo');
    
    titleEl.textContent = title;
    messageEl.textContent = message;
    modal.style.display = 'flex';
    
    // Remove existing listeners
    const newYesBtn = yesBtn.cloneNode(true);
    const newNoBtn = noBtn.cloneNode(true);
    yesBtn.parentNode.replaceChild(newYesBtn, yesBtn);
    noBtn.parentNode.replaceChild(newNoBtn, noBtn);
    
    document.getElementById('confirmYes').onclick = () => {
      modal.style.display = 'none';
      onConfirm();
    };
    
    document.getElementById('confirmNo').onclick = () => {
      modal.style.display = 'none';
    };
  }

  // Custom Alert Dialog
  function showAlert(message, type = 'success') {
    const modal = document.getElementById('alertModal');
    const messageEl = document.getElementById('alertMessage');
    const iconEl = document.getElementById('alertIcon');
    const okBtn = document.getElementById('alertOk');
    
    messageEl.textContent = message;
    
    // Set icon based on type
    if (type === 'success') {
      iconEl.textContent = '✓';
      iconEl.style.background = 'linear-gradient(135deg, #28a745, #20c997)';
    } else {
      iconEl.textContent = '✕';
      iconEl.style.background = 'linear-gradient(135deg, #dc3545, #c82333)';
    }
    
    modal.style.display = 'flex';
    
    okBtn.onclick = () => {
      modal.style.display = 'none';
    };
  }

  // Render saved QR codes
  function renderQRs() {
    container.innerHTML = "";
    qrList.forEach((item, index) => {
      const box = document.createElement("div");
      box.className = "qr-box";

      // Format date for display
      const displayDate = item.created_at || 'N/A';
      
      box.innerHTML = `
        <h4>${item.type}</h4>
        <p>${item.purpose}</p>
        ${item.queueNumber ? `<p><strong>Queue #${item.queueNumber}</strong></p>` : ''}
        <p><strong>Created:</strong> ${displayDate}</p>
        <div id="qr${index}"></div>
        <div class="qr-url-container">
          <p><small><strong>URL:</strong></small></p>
          <a href="${item.link}" target="_blank" class="qr-url-link">${item.link}</a>
        </div>
        <div class="qr-actions">
          <button onclick="downloadQR(${index})">Download QR</button>
          <button onclick="deleteQR(${index})">Delete</button>
        </div>
      `;
      container.appendChild(box);

      new QRCode(document.getElementById(`qr${index}`), {
        text: item.link,
        width: 128,
        height: 128
      });
    });
  }

  renderQRs();

  // Handle QR creation
  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const type = document.getElementById("queueType").value.trim();
    const purpose = document.getElementById("queuePurpose").value.trim();

    // Save QR to backend - URL will be auto-generated
    fetch("/generate_qr_db", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `type=${encodeURIComponent(type)}&purpose=${encodeURIComponent(purpose)}`
    })
    .then(res => {
      if (!res.ok) {
        return res.json().then(data => {
          throw new Error(data.error || `Server error: ${res.status}`);
        });
      }
      return res.json();
    })
    .then(data => {
      if (data.error) {
        throw new Error(data.error);
      }
      
      console.log("QR saved with auto-generated URL:", data);
      
      // Add to local list with auto-generated link
      const now = new Date();
      const formattedDate = now.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
      
      const newQR = { 
        type, 
        purpose, 
        link: data.queue_link || "#", 
        queueNumber: data.queue_number || 1,
        qrId: data.qr_id,
        created_at: formattedDate
      };
      qrList.push(newQR);
      localStorage.setItem("queues", JSON.stringify(qrList));
      
      renderQRs();
      form.reset();
      
      // Show helpful message
      showAlert("✅ Queue created successfully!", "success");
    })
    .catch(err => {
      console.error("Error generating QR:", err);
      const errorMsg = err.message || 'Please try again.';
      showAlert(`Error generating QR: ${errorMsg}\n\nCheck browser console (F12) for details.`, "error");
      
      // Log full error details
      console.error("Full error details:", {
        message: err.message,
        stack: err.stack,
        error: err
      });
    });
  });

  // Resolve QR id either from the saved reference or by looking up the link
  async function resolveQrId(qrItem) {
    if (qrItem.qrId) {
      return qrItem.qrId;
    }

    const link = (qrItem.link || '').trim();
    if (!link) {
      return null;
    }

    const tryLookup = async (endpoint) => {
      const response = await fetch(endpoint);
      if (!response.ok) {
        return null;
      }
      const rows = await response.json();
      const match = rows.find(row => (row.queue_link || '').trim() === link);
      return match ? match.id : null;
    };

    try {
      // Prefer active temp_qr table first
      let foundId = await tryLookup("/temp_qr_data");
      if (!foundId) {
        // Fall back to permanent history
        foundId = await tryLookup("/qr_history_data");
      }

      if (foundId) {
        qrItem.qrId = foundId;
        localStorage.setItem("queues", JSON.stringify(qrList));
      }

      return foundId;
    } catch (error) {
      console.error("Error resolving QR id:", error);
      return null;
    }
  }

  // Delete QR
  async function deleteQR(index) {
    const qrToDelete = qrList[index];
    
    showConfirmation(
      'Delete Queue',
      `Are you sure you want to delete "${qrToDelete.type}" from the generated queues?`,
      async () => {
        let qrId = await resolveQrId(qrToDelete);

        if (!qrId) {
          showConfirmation(
            'QR Not Found on Server',
            'QR record was not found on the server.\n\nDo you want to remove it locally from this list?',
            () => {
              qrList.splice(index, 1);
              localStorage.setItem("queues", JSON.stringify(qrList));
              renderQRs();
              showAlert("QR entry removed locally.", "success");
            }
          );
          return;
        }

        try {
          const response = await fetch("/delete_qr", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: qrId, force: true })
          });

          const data = await response.json();
          console.log("Delete response:", response.status, data);

          if (data.status === "success") {
            qrList.splice(index, 1);
            localStorage.setItem("queues", JSON.stringify(qrList));
            renderQRs();
            console.log("QR deleted successfully");
            showAlert("QR deleted successfully!", "success");
          } else {
            throw new Error(data.message || "Failed to delete QR");
          }
        } catch (err) {
          console.error("Error deleting QR:", err);
          // Force remove from localStorage anyway since backend may have already deleted it
          showConfirmation(
            'Server Error',
            `Server error: ${err.message}\n\nThe QR may already be deleted on the server.\nDo you want to remove it from this list anyway?`,
            () => {
              qrList.splice(index, 1);
              localStorage.setItem("queues", JSON.stringify(qrList));
              renderQRs();
              showAlert("QR entry removed from list.", "success");
            }
          );
        }
      }
    );
  }

  // Download QR as image
  function downloadQR(index) {
    const qrCanvas = document.querySelector(`#qr${index} canvas`);
    if (!qrCanvas) return;
    const link = document.createElement('a');
    link.href = qrCanvas.toDataURL("image/png");
    link.download = `QR_${qrList[index].type}.png`;
    link.click();
  }

  // View QR History with toggle functionality
  const viewHistoryBtn = document.getElementById("viewHistoryBtn");
  const qrContainerTitle = document.getElementById("qrContainerTitle");
  let isShowingHistory = false;

  viewHistoryBtn.addEventListener("click", () => {
    if (isShowingHistory) {
      // Show generated queues again
      renderQRs();
      viewHistoryBtn.textContent = "View QR History";
      qrContainerTitle.textContent = "Generated Queues";
      isShowingHistory = false;
    } else {
      // Show history
      fetch("/qr_history_data")
        .then(response => response.json())
        .then(data => {
          container.innerHTML = "";
          qrContainerTitle.textContent = "QR History";
          
          if (data.length === 0) {
            container.innerHTML = "<p style='text-align: center; color: #666; padding: 20px;'>No history available yet.</p>";
            viewHistoryBtn.textContent = "View Generated Queues";
            isShowingHistory = true;
            return;
          }
          
          data.forEach(item => {
            const box = document.createElement("div");
            box.className = "qr-box";
            
            // Format service time - if it's a decimal, show as MM:SS, otherwise show as minutes
            let serviceTimeDisplay;
            if (item.avg_service_time) {
              const totalMinutes = parseFloat(item.avg_service_time);
              const minutes = Math.floor(totalMinutes);
              const seconds = Math.round((totalMinutes - minutes) * 60);
              if (seconds > 0) {
                serviceTimeDisplay = `${minutes}m ${seconds}s`;
              } else {
                serviceTimeDisplay = `${minutes} min`;
              }
            } else {
              serviceTimeDisplay = 'N/A';
            }
            
            // Format date from database (YYYY-MM-DD HH:MM:SS) to readable format
            let formattedDate = 'N/A';
            if (item.created_at && item.created_at !== 'N/A') {
              try {
                const date = new Date(item.created_at);
                formattedDate = date.toLocaleDateString('en-US', { 
                  year: 'numeric', 
                  month: 'long', 
                  day: 'numeric',
                  hour: '2-digit',
                  minute: '2-digit'
                });
              } catch (e) {
                formattedDate = item.created_at; // Fallback to original if parsing fails
              }
            }
            
            box.innerHTML = `
              <h4>${item.queue_type}</h4>
              <p>${item.queue_purpose}</p>
              <p><strong>Created:</strong> ${formattedDate}</p>
              <p><strong>Avg Service Time:</strong> ${serviceTimeDisplay}</p>
              <p><strong>Staff/Windows:</strong> ${item.staff_count || 'N/A'}</p>
              <p><strong>Queue Limit:</strong> ${item.queue_limit || 'N/A'} customers/day</p>
              <p><strong>Schedule:</strong><br>
              Morning: ${item.morning_start || 'N/A'} - ${item.morning_end || 'N/A'}<br>
              Afternoon: ${item.afternoon_start || 'N/A'} - ${item.afternoon_end || 'N/A'}</p>
              <div id="historyQR${item.id}"></div>
              <div class="qr-url-container">
                <p><small><strong>URL:</strong></small></p>
                <a href="${item.queue_link}" target="_blank" class="qr-url-link">${item.queue_link}</a>
              </div>
              <p><small>Created by: ${item.created_by}</small></p>
            `;
            container.appendChild(box);

            new QRCode(document.getElementById(`historyQR${item.id}`), {
              text: item.queue_link,
              width: 128,
              height: 128
            });
          });
          
          viewHistoryBtn.textContent = "View Generated Queues";
          isShowingHistory = true;
        })
        .catch(err => {
          console.error(err);
          showAlert("Error loading QR history. Please try again.", "error");
        });
    }
  });
</script>
</body>
</html>
