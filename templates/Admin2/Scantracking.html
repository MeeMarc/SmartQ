<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan History | SmartQ</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='Admin2/Scantracking.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body>

  <header>
    <nav class="HomeNavbar">
      <a href="{{ url_for('homepage') }}" class="HomeLogo"><strong>SmartQ</strong></a>
      <ul class="HomeNavMenu">
        <li><a href="{{ url_for('homepage') }}">Home</a></li>
        <li><a href="{{ url_for('createq') }}">Create Queue</a></li>
        <li><a href="{{ url_for('scantracking') }}" class="active">Scan Tracking</a></li>
        <li><a href="{{ url_for('admin_settings') }}">Profile</a></li>
        <li><a href="{{ url_for('logout') }}" id="logout">Logout</a></li>
      </ul>
    </nav>
  </header>

<main class="HomeMainContent">
  <h2>QR Scanner Dashboard</h2>

  <div class="container-flex">
    <!-- LEFT: QR List -->
    <aside class="qr-list" id="qrListContainer">
      <h3>Generated Queues</h3>
      <!-- QR list injected dynamically -->
    </aside>

    <!-- RIGHT: Scan Details -->
    <section class="qr-detail" id="qrDetailContainer">
      <h3>Select a QR to see scans</h3>
      <!-- Scanned users will appear here -->
    </section>
  </div>
</main>

<!-- Modal for Add Candidate -->
<div class="modal" id="candidateModal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">×</span>
    <h3>Add Candidate</h3>
    <form id="candidateForm">
      <input type="hidden" id="modalQRLink">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" required>
      <label for="phone">Phone:</label>
      <input type="text" id="phone" required>
      <label for="timeslot">Timeslot:</label>
      <select id="timeslot" required>
        <option value="Morning">Morning</option>
        <option value="Afternoon">Afternoon</option>
        <option value="Evening">Evening</option>
      </select>
      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<script>
const qrListContainer = document.getElementById("qrListContainer");
const qrDetailContainer = document.getElementById("qrDetailContainer");
const modal = document.getElementById("candidateModal");
const candidateForm = document.getElementById("candidateForm");
const modalQRLink = document.getElementById("modalQRLink");

let currentScans = [];

// Fetch QR List - shows all from qr_history (permanent history)
function fetchQRList() {
  fetch("/qr_history_data")
    .then(res => res.json())
    .then(data => {
      qrListContainer.innerHTML = "<h3>Generated Queues (All History)</h3>";
      
      if (data.length === 0) {
        qrListContainer.innerHTML += "<p>No QR codes found. Create one in Create Queue page.</p>";
        return;
      }
      
      // Also check which ones are active in temp_qr
      fetch("/temp_qr_data")
        .then(res => res.json())
        .then(activeQRs => {
          const activeIds = new Set(activeQRs.map(qr => qr.id));
          
          data.forEach(qr => {
            const isActive = activeIds.has(qr.id);
            const box = document.createElement("div");
            box.className = "qr-box";
            box.style.opacity = isActive ? "1" : "0.6"; // Dim inactive ones
            box.innerHTML = `
              <h4>${qr.queue_type} ${!isActive ? '<span style="color: #999; font-size: 0.8em;">(Removed)</span>' : ''}</h4>
              <p>${qr.queue_purpose}</p>
              <div id="qr${qr.id}"></div>
              <p><small>${qr.queue_link}</small></p>
              ${isActive ? `
                <button onclick="openModal('${qr.queue_link}')">Add Candidate</button>
                <button onclick="viewScans(${qr.id})">View Scans</button>
              ` : `
                <button onclick="viewScans(${qr.id})">View Scans</button>
                <p style="color: #999; font-size: 0.85em;">This QR was removed but history is preserved</p>
              `}
            `;
            qrListContainer.appendChild(box);

            new QRCode(document.getElementById(`qr${qr.id}`), {
              text: qr.queue_link,
              width: 100,
              height: 100
            });
          });
        })
        .catch(() => {
          // If temp_qr_data endpoint doesn't exist, just show all as active
          data.forEach(qr => {
            const box = document.createElement("div");
            box.className = "qr-box";
            box.innerHTML = `
              <h4>${qr.queue_type}</h4>
              <p>${qr.queue_purpose}</p>
              <div id="qr${qr.id}"></div>
              <p><small>${qr.queue_link}</small></p>
              <button onclick="openModal('${qr.queue_link}')">Add Candidate</button>
              <button onclick="viewScans(${qr.id})">View Scans</button>
            `;
            qrListContainer.appendChild(box);

            new QRCode(document.getElementById(`qr${qr.id}`), {
              text: qr.queue_link,
              width: 100,
              height: 100
            });
          });
        });
    })
    .catch(err => {
      console.error("Error fetching QR list:", err);
      qrListContainer.innerHTML = "<h3>Generated Queues</h3><p>Error loading QR codes.</p>";
    });
}

// Auto-refresh QR list every 5 seconds to sync with CreateQ deletions
fetchQRList();
setInterval(fetchQRList, 60000);

// Modal functions
function openModal(link) {
  modal.style.display = "flex";
  modalQRLink.value = link;
}
function closeModal() {
  modal.style.display = "none";
  candidateForm.reset();
}

// Handle Add Candidate submission
candidateForm.addEventListener("submit", function(e) {
  e.preventDefault();
  const data = {
    fullname: document.getElementById("fullname").value,
    phone: document.getElementById("phone").value,
    timeslot: document.getElementById("timeslot").value,
    link: modalQRLink.value
  };

  fetch("/add_candidate_modal", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(resp => {
    if(resp.status === "success") {
      alert("✅ Candidate added successfully!");
      closeModal();
      // Refresh scans if currently viewing the QR
      const displayedQR = document.querySelector(`#qrDetailContainer h3`);
      if(displayedQR && displayedQR.textContent.includes(data.link)) {
        viewScans(resp.qr_id);
      }
    } else {
      alert("❌ Error: " + resp.message);
    }
  })
  .catch(err => console.error(err));
});

// View scans for a specific QR
function viewScans(qrId) {
  fetch(`/get_qr_scans/${qrId}`)
    .then(res => res.json())
    .then(data => {
      currentScans = data;
      qrDetailContainer.innerHTML = `
        <h3>Scans for QR #${qrId}</h3>
        <input type="text" id="scanSearch" placeholder="Search by name, phone, purpose, or status">
        <div class="scan-list" id="scanList"></div>
      `;
      document.getElementById("scanSearch").addEventListener("input", filterScans);
      renderScans(currentScans);
    });
}

// Render scans
function renderScans(scans) {
  const scanList = document.getElementById("scanList");
  scanList.innerHTML = "";

  if (scans.length === 0) {
    scanList.innerHTML = "<p>No scans found.</p>";
    return;
  }

  scans.forEach(user => {
    const card = document.createElement("div");
    card.className = "scan-card";
    const phone = user.phone ? ` • ${user.phone}` : "";
    const purpose = user.purpose ? ` • ${user.purpose}` : "";
    const scannedAt = user.scanned_at ? ` • ${user.scanned_at}` : "";
    const status = user.status ? user.status.charAt(0).toUpperCase() + user.status.slice(1) : "Waiting";
    const statusClass = user.status === 'completed' ? 'status-completed' : user.status === 'cancelled' ? 'status-cancelled' : 'status-waiting';
    
    card.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: start;">
        <div>
          <strong>${user.fullname}</strong>${phone}${purpose}${scannedAt}
        </div>
        <span class="status-badge ${statusClass}">${status}</span>
      </div>
    `;
    scanList.appendChild(card);
  });
}

// Filter scans by search
function filterScans() {
  const query = document.getElementById("scanSearch").value.toLowerCase();
  const filtered = currentScans.filter(user =>
    (user.fullname && user.fullname.toLowerCase().includes(query)) ||
    (user.phone && user.phone.toLowerCase().includes(query)) ||
    (user.purpose && user.purpose.toLowerCase().includes(query)) ||
    (user.status && user.status.toLowerCase().includes(query))
  );
  renderScans(filtered);
}
</script>

</body>
</html>
