<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan History | SmartQ</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='Admin2/Scantracking.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body>

  <header>
    <nav class="HomeNavbar">
      <a href="{{ url_for('homepage') }}" class="HomeLogo"><strong>SmartQ</strong></a>
      <ul class="HomeNavMenu">
        <li><a href="{{ url_for('homepage') }}">Home</a></li>
        <li><a href="{{ url_for('createq') }}">Create Queue</a></li>
        <li><a href="{{ url_for('scantracking') }}" class="active">Scan Tracking</a></li>
        <li><a href="{{ url_for('admin_settings') }}">Profile</a></li>
        <li><a href="{{ url_for('logout') }}" id="logout">Logout</a></li>
      </ul>
    </nav>
  </header>

<main class="HomeMainContent">
  <h2>QR Scanner Dashboard</h2>

  <div class="container-flex">
    <!-- LEFT: QR List -->
    <aside class="qr-list" id="qrListContainer">
      <h3>Generated Queues</h3>
      <!-- QR list injected dynamically -->
    </aside>

    <!-- RIGHT: Scan Details -->
    <section class="qr-detail" id="qrDetailContainer">
      <h3>Select a QR to see scans</h3>
      <!-- Scanned users will appear here -->
    </section>
  </div>
</main>

<!-- Confirmation Modal -->
<div class="confirmation-overlay" id="confirmationModal" style="display: none;">
  <div class="confirmation-modal">
    <div class="confirmation-icon">⚠️</div>
    <h3 id="confirmationTitle">Confirm Action</h3>
    <p id="confirmationMessage">Are you sure you want to proceed?</p>
    <div class="confirmation-buttons">
      <button class="confirm-btn-yes" id="confirmYes">Yes, Proceed</button>
      <button class="confirm-btn-no" id="confirmNo">Cancel</button>
    </div>
  </div>
</div>

<!-- Success/Error Modal -->
<div class="alert-overlay" id="alertModal" style="display: none;">
  <div class="alert-modal">
    <div class="alert-icon" id="alertIcon">✓</div>
    <p id="alertMessage">Success!</p>
    <button class="alert-btn" id="alertOk">OK</button>
  </div>
</div>

<!-- Modal for Add Candidate -->
<div class="modal" id="candidateModal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal()">×</span>
    <h3>Add Candidate</h3>
    <form id="candidateForm">
      <input type="hidden" id="modalQRLink">
      
      <label for="lastname">Last Name: <span style="color: red;">*</span></label>
      <input type="text" id="lastname" placeholder="Dela Cruz" required>
      
      <label for="firstname">First Name: <span style="color: red;">*</span></label>
      <input type="text" id="firstname" placeholder="Juan" required>
      
      <label for="middleinitial">Middle Initial:</label>
      <input type="text" id="middleinitial" placeholder="(optional)" maxlength="2">
      
      <label for="suffix">Suffix (if applicable):</label>
      <input type="text" id="suffix" placeholder="Jr., Sr., III (optional)" maxlength="10">
      
      <label for="phone">Phone: <span style="color: red;">*</span></label>
      <input type="text" id="phone" placeholder="09*********" required>
      
      <button type="submit">Submit</button>
    </form>
  </div>
</div>

<script>
const qrListContainer = document.getElementById("qrListContainer");
const qrDetailContainer = document.getElementById("qrDetailContainer");
const modal = document.getElementById("candidateModal");
const candidateForm = document.getElementById("candidateForm");
const modalQRLink = document.getElementById("modalQRLink");

let currentScans = [];
let currentQRId = null;

// Custom Confirmation Dialog
function showConfirmation(title, message, onConfirm) {
  const modal = document.getElementById('confirmationModal');
  const titleEl = document.getElementById('confirmationTitle');
  const messageEl = document.getElementById('confirmationMessage');
  const yesBtn = document.getElementById('confirmYes');
  const noBtn = document.getElementById('confirmNo');
  
  titleEl.textContent = title;
  messageEl.textContent = message;
  modal.style.display = 'flex';
  
  // Remove existing listeners
  const newYesBtn = yesBtn.cloneNode(true);
  const newNoBtn = noBtn.cloneNode(true);
  yesBtn.parentNode.replaceChild(newYesBtn, yesBtn);
  noBtn.parentNode.replaceChild(newNoBtn, noBtn);
  
  document.getElementById('confirmYes').onclick = () => {
    modal.style.display = 'none';
    onConfirm();
  };
  
  document.getElementById('confirmNo').onclick = () => {
    modal.style.display = 'none';
  };
}

// Custom Alert Dialog
function showAlert(message, type = 'success') {
  const modal = document.getElementById('alertModal');
  const messageEl = document.getElementById('alertMessage');
  const iconEl = document.getElementById('alertIcon');
  const okBtn = document.getElementById('alertOk');
  
  messageEl.textContent = message;
  
  // Set icon based on type
  if (type === 'success') {
    iconEl.textContent = '✓';
    iconEl.style.background = 'linear-gradient(135deg, #28a745, #20c997)';
  } else {
    iconEl.textContent = '✕';
    iconEl.style.background = 'linear-gradient(135deg, #dc3545, #c82333)';
  }
  
  modal.style.display = 'flex';
  
  okBtn.onclick = () => {
    modal.style.display = 'none';
  };
}

// Mark entry as done
function markAsDone(entryId, buttonElement) {
  showConfirmation(
    'Mark as Complete',
    'Are you sure you want to mark this user as served/completed?',
    () => {
      fetch('/update_queue_status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          entry_id: entryId,
          status: 'completed'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          showAlert('User marked as completed!', 'success');
          // Refresh the scan list
          if (currentQRId) {
            viewScans(currentQRId);
          }
        } else {
          showAlert('Error: ' + data.message, 'error');
        }
      })
      .catch(err => {
        console.error('Error marking as done:', err);
        showAlert('Failed to update status', 'error');
      });
    }
  );
}

// Fetch QR List - shows all from qr_history (permanent history)
function fetchQRList() {
  fetch("/qr_history_data")
    .then(res => res.json())
    .then(data => {
      qrListContainer.innerHTML = "<h3>Generated Queues</h3>";
      
      if (data.length === 0) {
        qrListContainer.innerHTML += "<p>No QR codes found. Create one in Create Queue page.</p>";
        return;
      }
      
      // Also check which ones are active in temp_qr
      fetch("/temp_qr_data")
        .then(res => res.json())
        .then(activeQRs => {
          const activeIds = new Set(activeQRs.map(qr => qr.id));
          
          data.forEach(qr => {
            const isActive = activeIds.has(qr.id);
            const box = document.createElement("div");
            box.className = "qr-box";
            box.style.opacity = isActive ? "1" : "0.6"; // Dim inactive ones
            
            // Format date from database (YYYY-MM-DD HH:MM:SS) to readable format
            let formattedDate = 'N/A';
            if (qr.created_at && qr.created_at !== 'N/A') {
              try {
                const date = new Date(qr.created_at);
                formattedDate = date.toLocaleDateString('en-US', { 
                  year: 'numeric', 
                  month: 'long', 
                  day: 'numeric',
                  hour: '2-digit',
                  minute: '2-digit'
                });
              } catch (e) {
                formattedDate = qr.created_at; // Fallback to original if parsing fails
              }
            }
            
            box.innerHTML = `
              <h4>${qr.queue_type} ${!isActive ? '<span style="color: #999; font-size: 0.8em;">(Removed)</span>' : ''}</h4>
              <p>${qr.queue_purpose}</p>
              <p><strong>Created:</strong> ${formattedDate}</p>
              <div id="qr${qr.id}"></div>
              <p><small><a href="${qr.queue_link}" target="_blank" style="color: #0066cc; text-decoration: underline;">${qr.queue_link}</a></small></p>
              ${isActive ? `
                <button onclick="openModal('${qr.queue_link}')">Add Candidate</button>
                <button onclick="viewScans(${qr.id})">View Scans</button>
              ` : `
                <button onclick="viewScans(${qr.id})">View Scans</button>
                <p style="color: #999; font-size: 0.85em;">This QR was removed but history is preserved</p>
              `}
            `;
            qrListContainer.appendChild(box);

            new QRCode(document.getElementById(`qr${qr.id}`), {
              text: qr.queue_link,
              width: 100,
              height: 100
            });
          });
        })
        .catch(() => {
          // If temp_qr_data endpoint doesn't exist, just show all as active
          data.forEach(qr => {
            const box = document.createElement("div");
            box.className = "qr-box";
            
            // Format date from database (YYYY-MM-DD HH:MM:SS) to readable format
            let formattedDate = 'N/A';
            if (qr.created_at && qr.created_at !== 'N/A') {
              try {
                const date = new Date(qr.created_at);
                formattedDate = date.toLocaleDateString('en-US', { 
                  year: 'numeric', 
                  month: 'long', 
                  day: 'numeric',
                  hour: '2-digit',
                  minute: '2-digit'
                });
              } catch (e) {
                formattedDate = qr.created_at; // Fallback to original if parsing fails
              }
            }
            
            box.innerHTML = `
              <h4>${qr.queue_type}</h4>
              <p>${qr.queue_purpose}</p>
              <p><strong>Created:</strong> ${formattedDate}</p>
              <div id="qr${qr.id}"></div>
              <p><small><a href="${qr.queue_link}" target="_blank" style="color: #0066cc; text-decoration: underline;">${qr.queue_link}</a></small></p>
              <button onclick="openModal('${qr.queue_link}')">Add Candidate</button>
              <button onclick="viewScans(${qr.id})">View Scans</button>
            `;
            qrListContainer.appendChild(box);

            new QRCode(document.getElementById(`qr${qr.id}`), {
              text: qr.queue_link,
              width: 100,
              height: 100
            });
          });
        });
    })
    .catch(err => {
      console.error("Error fetching QR list:", err);
      qrListContainer.innerHTML = "<h3>Generated Queues</h3><p>Error loading QR codes.</p>";
    });
}

// Auto-refresh QR list every 5 seconds to sync with CreateQ deletions
fetchQRList();
setInterval(fetchQRList, 60000);

// Modal functions
function openModal(link) {
  modal.style.display = "flex";
  modalQRLink.value = link;
}
function closeModal() {
  modal.style.display = "none";
  candidateForm.reset();
}

// Handle Add Candidate submission
candidateForm.addEventListener("submit", function(e) {
  e.preventDefault();
  
  // Get individual name fields
  const lastname = document.getElementById("lastname").value.trim();
  const firstname = document.getElementById("firstname").value.trim();
  const middleinitial = document.getElementById("middleinitial").value.trim();
  const suffix = document.getElementById("suffix").value.trim();
  const phone = document.getElementById("phone").value.trim();
  
  // Validate required fields
  if (!lastname || !firstname || !phone) {
    alert("Please provide Last Name, First Name, and Phone Number.");
    return;
  }
  
  // Construct fullname from separate fields (same format as registration form)
  // Format: "Lastname, Firstname M.I. Suffix"
  const name_parts = [lastname, firstname];
  if (middleinitial) {
    name_parts.push(middleinitial);
  }
  if (suffix) {
    name_parts.push(suffix);
  }
  
  let fullname = name_parts.slice(0, 2).join(', '); // "Lastname, Firstname"
  if (name_parts.length > 2) {
    fullname += ' ' + name_parts.slice(2).join(' '); // Add middle initial and suffix
  }
  
  const data = {
    fullname: fullname,
    phone: phone,
    link: modalQRLink.value
  };

  fetch("/add_candidate_modal", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(resp => {
    if(resp.status === "success") {
      alert("Candidate added successfully!");
      closeModal();
      // Refresh scans if currently viewing the QR
      const displayedQR = document.querySelector(`#qrDetailContainer h3`);
      if(displayedQR && displayedQR.textContent.includes(data.link)) {
        viewScans(resp.qr_id);
      }
    } else {
      alert("Error: " + resp.message);
    }
  })
  .catch(err => console.error(err));
});

// View scans for a specific QR
function viewScans(qrId) {
  currentQRId = qrId;
  fetch(`/get_qr_scans/${qrId}`)
    .then(res => res.json())
    .then(data => {
      currentScans = data;
      qrDetailContainer.innerHTML = `
        <h3>Scans for QR #${qrId}</h3>
        <input type="text" id="scanSearch" placeholder="Search by name, phone, purpose, or status">
        <div class="scan-list" id="scanList"></div>
      `;
      document.getElementById("scanSearch").addEventListener("input", filterScans);
      renderScans(currentScans);
    });
}

// Render scans
function renderScans(scans) {
  const scanList = document.getElementById("scanList");
  scanList.innerHTML = "";

  if (scans.length === 0) {
    scanList.innerHTML = "<p>No scans found.</p>";
    return;
  }

  scans.forEach(user => {
    const card = document.createElement("div");
    card.className = "scan-card";
    const phone = user.phone ? ` • ${user.phone}` : "";
    const purpose = user.purpose ? ` • ${user.purpose}` : "";
    const scannedAt = user.scanned_at ? ` • ${user.scanned_at}` : "";
    const status = user.status ? user.status.charAt(0).toUpperCase() + user.status.slice(1) : "Waiting";
    const statusClass = user.status === 'completed' ? 'status-completed' : user.status === 'cancelled' ? 'status-cancelled' : user.status === 'rescheduled' ? 'status-rescheduled' : 'status-waiting';
    
    card.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 15px;">
        <div style="flex: 1;">
          <strong>${user.fullname}</strong>${phone}${purpose}${scannedAt}
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="status-badge ${statusClass}">${status}</span>
          ${user.status !== 'completed' && user.status !== 'cancelled' && user.status !== 'rescheduled' ? `<button class="done-btn" onclick="markAsDone(${user.id}, this)">Done</button>` : ''}
        </div>
      </div>
    `;
    scanList.appendChild(card);
  });
}

// Filter scans by search
function filterScans() {
  const query = document.getElementById("scanSearch").value.toLowerCase();
  const filtered = currentScans.filter(user =>
    (user.fullname && user.fullname.toLowerCase().includes(query)) ||
    (user.phone && user.phone.toLowerCase().includes(query)) ||
    (user.purpose && user.purpose.toLowerCase().includes(query)) ||
    (user.status && user.status.toLowerCase().includes(query))
  );
  renderScans(filtered);
}
</script>

</body>
</html>
