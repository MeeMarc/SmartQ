<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Settings - SmartQ</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='Admin2/Profile.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

</head>
<body>
  <header>
    <nav class="HomeNavbar">
      <a href="{{ url_for('homepage') }}" class="HomeLogo"><strong>SmartQ</strong></a>
      <ul class="HomeNavMenu">
        <li><a href="{{ url_for('homepage') }}">Home</a></li>
        <li><a href="{{ url_for('createq') }}">Create Queue</a></li>
        <li><a href="{{ url_for('scantracking') }}">Scan Tracking</a></li>
        <li><a href="{{ url_for('admin_settings') }}" class="active">Profile</a></li>
        <li><a href="{{ url_for('logout') }}" id="logout">Logout</a></li>
      </ul>
    </nav>
  </header>

  
  <main>
    <section class="settings-section">
      <h2>Profile</h2>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">
            {% for msg in messages %}
              <p>{{ msg }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('admin_settings') }}">
 <label>Full Name:</label>
<p>{{ admin[0] if admin else '' }}</p> <!-- display as text -->

<label>Email:</label>
<p>{{ admin[1] if admin else '' }}</p> <!-- display as text -->

<!-- ✅ Added Old Password -->
<label>Old Password:</label>
<div class="input-group">
  <input type="password" id="old_password" name="old_password" placeholder="Enter old password" required>
  <i class="toggle-password fa fa-eye-slash" onclick="togglePassword('old_password', this)"></i>
</div>

<label>New Password:</label>
<div class="input-group">
  <input type="password" id="new_password" name="new_password" placeholder="Enter new password" />
  <i class="toggle-password fa fa-eye-slash" onclick="togglePassword('new_password', this)"></i>
</div>

<label>Confirm Password:</label>
<div class="input-group">
  <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" />
  <i class="toggle-password fa fa-eye-slash" onclick="togglePassword('confirm_password', this)"></i>
</div>



  <button type="submit">Save Changes</button>
</form>

    </section>
  </main>
<script>
function togglePassword(id, el) {
  const input = document.getElementById(id);

  if (input.type === "password") {
    input.type = "text";
    el.classList.remove("fa-eye-slash");
    el.classList.add("fa-eye");
  } else {
    input.type = "password";
    el.classList.remove("fa-eye");
    el.classList.add("fa-eye-slash");
  }
}
</script>

</body>
</html>
