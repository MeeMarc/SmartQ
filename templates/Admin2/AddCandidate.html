<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Candidate | SmartQ</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='Admin2/AddCandidate.css') }}">
</head>
<body>
 

<!-- ================= HEADER / NAV ================= -->
  <header>
    <nav class="HomeNavbar">
      <a href="{{ url_for('homepage') }}" class="HomeLogo"><strong>SmartQ</strong></a>
      <ul class="HomeNavMenu">
        <li><a href="{{ url_for('homepage') }}">Home</a></li>
        <li><a href="{{ url_for('createq') }}">Create Queue</a></li>
        <li><a href="{{ url_for('addcandidate') }}">Add Candidate</a></li>
        <li><a href="{{ url_for('scantracking') }}">Scan Tracker</a></li>
        <li><a href="{{ url_for('admin_settings') }}" class="active">Settings</a></li>
        <li><a href="{{ url_for('logout') }}" id="logout">Logout</a></li>

      </ul>
    </nav>
  </header>

<!-- ================= ADD CANDIDATE FORM ================= -->
<section id="paper-section" class="paper-section">
  <form class="paper-form" id="candidateForm" method="POST">
    <div class="form-row">
      <h3>Add Candidate</h3>

      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required>

      <div class="name-hint">
        <span>Last Name,</span>
        <span>First Name</span>
        <span>Middle Initial</span>
        <span>Suffix</span>
      </div>
    </div>

    <div class="form-row">
      <label for="phone">Phone Number</label>
      <input type="text" id="phone" name="phone" placeholder="09*********" required>
    </div>

    <div class="form-row">
      <label for="timeslot">Preferred Time</label>
      <select id="timeslot" name="timeslot" required>
        <option value="" disabled selected>Select Time</option>
        <option value="morning">Morning</option>
        <option value="afternoon">Afternoon</option>
      </select>
    </div>

    <div class="form-row">
      <label for="purpose">Purpose</label>
      <textarea id="purpose" name="purpose" rows="3" placeholder="Optional"></textarea>
    </div>

    <div class="form-row">
      <button type="submit">Submit</button>
    </div>
  </form>
</section>

</body>
</html>
