<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="../static/login.css" />
</head>
<body>
  <div class="container" style="max-width: 520px; box-shadow: 0 8px 25px rgba(0,0,0,0.12);">
    <div class="right" style="width: 100%; padding: 40px 32px;">
      <h2 style="text-align:center; margin-bottom: 16px;">Reset Password</h2>
      <p style="text-align:center; margin-bottom: 24px; color:#45526c;">
        Set a new password for <strong>{{ email }}</strong>
      </p>
      <form method="POST" action="{{ url_for('reset_password', token=token) }}">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>

        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>

        <button type="submit">Change Password</button>
      </form>
      <div class="footer-text" style="margin-top:18px;">
        Remembered it? <a href="{{ url_for('login') }}">Back to login</a>
      </div>
    </div>
  </div>
</body>
</html>
