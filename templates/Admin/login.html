<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../static/login.css" />
  <!-- Font Awesome for eye icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<div class="container">
  <!-- Left Panel -->
  <div class="left">
    <img src="{{ app_settings.logo_url }}" alt="{{ app_settings.app_name }} Logo" class="login-logo">
    <h1>Welcome Back!</h1>
  </div>

  <!-- Right Panel -->
  <div class="right">
          {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
              <div id="flashMessage" class="flash-messages" style="transition: opacity 0.5s ease-out;">
         {% for category, message in messages %}
        <p class="{% if category == 'logout' or category == 'success' %}success{% else %}error{% endif %}">{{ message }}</p>
         {% endfor %}
        </div>
        {% endif %}
           {% endwith %}
    <h2>Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
      <label for="Email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <i class="toggle-password fa fa-eye" onclick="togglePassword('password', this)"></i>
      </div>

      <div class="checkbox">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember Me</label>
      </div>

      <button type="submit">Log in</button>

 

      <div class="footer-text">
        Don’t have an account? <a href="{{ url_for('signup') }}">Sign UP</a>
      </div>
    </form>
  </div>
</div>

  <!-- JS for toggle password -->
  <script>
    function togglePassword(id, el) {
      const input = document.getElementById(id);
      if(input.type === "password") {
        input.type = "text";
        el.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        el.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Remember Me functionality
    document.addEventListener('DOMContentLoaded', function() {
      // Load saved email if "Remember Me" was checked previously
      const savedEmail = localStorage.getItem('rememberedEmail');
      const rememberCheckbox = document.getElementById('remember');
      const emailInput = document.getElementById('email');
      
      if (savedEmail) {
        emailInput.value = savedEmail;
        rememberCheckbox.checked = true;
      }
      
      // Handle form submission - save email if "Remember Me" is checked
      const loginForm = document.querySelector('form[method="POST"]');
      if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
          if (rememberCheckbox.checked) {
            // Save email to localStorage
            localStorage.setItem('rememberedEmail', emailInput.value);
          } else {
            // Remove saved email if "Remember Me" is unchecked
            localStorage.removeItem('rememberedEmail');
          }
        });
      }

      // Auto-dismiss flash messages after 5 seconds
      const flashMessages = document.getElementById('flashMessage') || document.querySelector('.flash-messages');
      if (flashMessages) {
        setTimeout(() => {
          flashMessages.style.opacity = '0';
          flashMessages.style.transform = 'translate(-50%, -45%)';
          setTimeout(() => flashMessages.remove(), 500);
        }, 5000); // Changed to 5 seconds
        
        // Also allow clicking anywhere to dismiss
        flashMessages.addEventListener('click', function() {
          flashMessages.style.opacity = '0';
          flashMessages.style.transform = 'translate(-50%, -45%)';
          setTimeout(() => flashMessages.remove(), 500);
        });
      }
    });
  </script>
</body>
</html>
