<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../static/login.css" />
  <!-- Font Awesome for eye icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<div class="container">
  <!-- Left Panel -->
  <div class="left">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SmartQ Logo" class="login-logo">
    <h1>Welcome Back!</h1>
  </div>

  <!-- Right Panel -->
  <div class="right">
          {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
              <div class="flash-messages">
         {% for category, message in messages %}
          {% if category == 'logout' or not category %}
        <p>{{ message }}</p>
          {% endif %}
         {% endfor %}
        </div>
        {% endif %}
           {% endwith %}
    <h2>Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
      <label for="Email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <i class="toggle-password fa fa-eye" onclick="togglePassword('password', this)"></i>
      </div>

      <div class="checkbox">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember Me</label>
      </div>

      <button type="submit">Log in</button>

 

      <div class="footer-text">
        Don’t have an account? <a href="{{ url_for('signup') }}">Sign UP</a>
      </div>
    </form>
  </div>
</div>

  <!-- JS for toggle password -->
  <script>
    function togglePassword(id, el) {
      const input = document.getElementById(id);
      if(input.type === "password") {
        input.type = "text";
        el.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        el.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Auto-dismiss flash messages after 4 seconds
    document.addEventListener('DOMContentLoaded', function() {
      const flashMessages = document.querySelector('.flash-messages');
      if (flashMessages) {
        setTimeout(() => {
          flashMessages.style.opacity = '0';
          flashMessages.style.transform = 'translate(-50%, -45%)';
          setTimeout(() => flashMessages.remove(), 300);
        }, 4000);
        
        // Also allow clicking anywhere to dismiss
        flashMessages.addEventListener('click', function() {
          flashMessages.style.opacity = '0';
          flashMessages.style.transform = 'translate(-50%, -45%)';
          setTimeout(() => flashMessages.remove(), 300);
        });
      }
    });
  </script>
</body>
</html>
