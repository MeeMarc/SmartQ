<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartQ</title>
  <link rel="stylesheet" href="../static/User.css">
</head>
<body>

<header>
  <nav class="navbar">
    <a href="User.html" class="logo"><strong>SmartQ</strong></a>

    <div class="menu-wrapper">
      <div class="menu-toggle" id="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul class="navmenu" id="navmenu">
        <li><a href="Waiting.html">Waiting Form</a></li>
      </ul>
    </div>
  </nav>
</header>




<!-- Section 1: How It Works -->
<section class="how-it-works-slider">
  <h3>How It Works</h3>

  <div class="slider" id="carousel">
    <div class="card active">
      <img src="../static/images/step-1.png" alt="step 1">
      <p><strong>STEP 1</strong></p>
      <p2>Scan the QR code.</p2>
    </div>

    <div class="card">
      <img src="../static/images/step2.png" alt="step 2">
      <p><strong>STEP 2</strong></p>
      <p2>Fill out the registration form.</p2>
    </div>

    <div class="card">
      <img src="../static/images/step3.png" alt="step 3">
      <p><strong>STEP 3</strong></p>
      <p2>Wait for a notification when your turn is near.</p2>
    </div>

    <div class="card">
      <img src="../static/images/step4.png" alt="step 4">
      <p><strong>STEP 4</strong></p>
      <p2>Proceed to the counter when notified.</p2>
    </div>
  </div>

  <!-- ✅ Navigation Buttons -->
  <div class="slider-controls">
    <button id="prevBtn">❮ Prev</button>
    <button id="nextBtn">Next ❯</button>
  </div>
</section>



<!-- Section 2: Processing of the Papers -->
<section id="paper-section" class="paper-section">
  <form class="paper-form" id="registrationForm" action="#" method="post">
    
    <h3>Registration Form</h3>

    <!-- ✅ New read-only textarea for scanned QR -->
    <div class="form-row">
      <label for="qrData">Documents</label>
      <div id="qrDisplay" class="qr-display-box">
        <span class="doc-name">Example: COR</span>
        <span class="doc-desc">Claiming</span>
      </div>
    </div>

    <!-- ✅ Full Name (with hint inside field) -->
    <div class="form-row">
      <label for="fullname">Full Name:</label>
      <div class="input-wrapper">
        <input type="text" id="fullname" name="fullname" required>
        <div class="name-hint">
          <span>Last Name,</span>
          <span>First Name</span>
          <span>Middle Initial</span>
          <span>Suffix</span>
        </div>
      </div>
    </div>

    <!-- ✅ Phone Number -->
    <div class="form-row">
      <label for="phone">Phone Number:</label>
      <textarea id="phone" name="phone" rows="1" placeholder="09*********" required></textarea>
    </div>

    <!-- ✅ Purpose -->
    <div class="form-row">
      <label for="purpose">Purpose:</label>
      <textarea id="purpose" name="purpose" rows="4" placeholder="Optional"></textarea>
    </div>

    <!-- ✅ Submit Button -->
    <div class="form-row">
      <button type="button" onclick="window.location.href='Waiting.html'">Submit</button>
    </div>
    
  </form>
</section>

<script>
  const cards = document.querySelectorAll('.card');
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');
  let current = 0;

  function updateCards() {
    cards.forEach(card => card.classList.remove('active', 'prev', 'next'));
    
    const prevIndex = (current - 1 + cards.length) % cards.length;
    const nextIndex = (current + 1) % cards.length;

    cards[current].classList.add('active');
    cards[prevIndex].classList.add('prev');
    cards[nextIndex].classList.add('next');
  }

  nextBtn.addEventListener('click', () => {
    current = (current + 1) % cards.length;
    updateCards();
  });

  prevBtn.addEventListener('click', () => {
    current = (current - 1 + cards.length) % cards.length;
    updateCards();
  });

  // Auto slide every 3 seconds
  setInterval(() => {
    current = (current + 1) % cards.length;
    updateCards();
  }, 10000);

  updateCards();
</script>


<script>
  const menuToggle = document.getElementById('menu-toggle');
  const navMenu = document.getElementById('navmenu');

  menuToggle.addEventListener('click', () => {
    menuToggle.classList.toggle('active');
    navMenu.classList.toggle('active');
  });
</script>


<script>
  function onQRScanned(scannedData) {
    const [doc, desc] = scannedData.split("|");
    const qrBox = document.getElementById("qrDisplay");

    qrBox.innerHTML = `
      <span class="doc-name">${doc}</span>
      <span class="doc-desc">${desc}</span>
    `;
    qrBox.classList.add("filled");
  }

  // Demo only — automatically fill after 3 seconds
  setTimeout(() => {
    onQRScanned("COR|Claiming");
  }, 3000);
</script>



</body>
</html>
