<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../static/Admin2/Scantracking.css">
</head>
<body>

<header>
  <nav class="HomeNavbar">
    <a href="Homepage.html" class="HomeLogo"><strong>SmartQ</strong></a>
<ul class="HomeNavMenu">
  <li><a href="Homepage.html">Home</a></li>
  <li><a href="CreateQ.html">Create Queue</a></li>
  <li><a href="AddCandidate.html">Add Candidate</a></li>

</ul>

  </nav>
</header>

<main class="HomeMainContent">
  <h2>QR Scanner Dashboard</h2>

  <div class="HomeTwoContainer">

    <!-- LEFT SIDE NAVIGATION -->
    <aside class="HomeLeftContainer">
      <h3>Navigation</h3>
      <nav class="sidebar-nav">
        <button class="nav-btn active">Dashboard</button>
        <button class="nav-btn">Export Data</button>
        <button class="nav-btn danger">Clear All</button>
      </nav>
    </aside>

    <!-- RIGHT SIDE USER LIST -->
    <section class="HomeRightContainer">
      
      <!-- Filter + Search -->
      <div class="filter-section">
        <div class="filter-left">
          <label for="schedule">Schedule:</label>
          <select id="schedule">
            <option value="all">All</option>
            <option value="morning">Morning</option>
            <option value="afternoon">Afternoon</option>
          </select>
        </div>

        <div class="filter-right">
          <label for="search">Search:</label>
          <input type="text" id="search" placeholder="Search by name">
        </div>
      </div>

      <!-- User List -->
      <div class="user-list">
        <div class="user-card">
          <div class="user-info">
            <h4>Juan Dela Cruz</h4>
            <p>Mobile: 09123456789</p>
          </div>
          <div class="user-meta">
            <p class="user-schedule">Morning</p>
            <p class="user-time">08:45 AM</p>
          </div>
        </div>

        <div class="user-card">
          <div class="user-info">
            <h4>Maria Santos</h4>
            <p>Mobile: 09987654321</p>
          </div>
          <div class="user-meta">
            <p class="user-schedule">Afternoon</p>
            <p class="user-time">02:10 PM</p>
          </div>
        </div>
      </div>

    </section>
  </div>
</main>

</body>
</html>
