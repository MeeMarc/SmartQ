<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Candidate | SmartQ</title>
  <link rel="stylesheet" href="../static/Admin2/AddCandidate.css" />
</head>
<body>

<header>
  <nav class="HomeNavbar">
    <a href="Homepage.html" class="HomeLogo"><strong>SmartQ</strong></a>
    <ul class="HomeNavMenu">
      <li><a href="Homepage.html">Home</a></li>
      <li><a href="CreateQ.html">Create Queue</a></li>
      <li><a href="AddCandidate.html">Add Candidate</a></li>
      <li><a href="../Admin/login.html" id="logout">Logout</a></li>
    </ul>
  </nav>
</header>

<section id="paper-section" class="paper-section">

      <form class="paper-form" action="#" method="post">
       <div class="form-row">
  <h3>Add Candidate</h3>

  <label for="fullname">Full Name</label>
  <input type="text" id="fullname" name="fullname" required>

  <div class="name-hint">
    <span>Last Name,</span>
    <span>First Name </span>
    <span>Middle Initial</span>
    <span>Suffix</span>
  </div>
</div>

        <div class="form-row">
          <label for="phone">Phone Number</label>
          <textarea id="purpose" name="purpose" rows="1" placeholder="09*********"></textarea>
        </div>
          <div class="form-row">
            <label for="purpose">Purpose</label>
            <textarea id="purpose" name="purpose" rows="4" placeholder="Optional"></textarea>
          </div>
        <div>
          <button type="button" onclick="window.location.href='Waiting.html'">Submit</button>

        </div>
      </form>
  </section>

</body>
</html>
